name: CI - Load test secrets and run specs

on:
  pull_request:
  push:
    branches: [ main, '010-policies-validation-frontend', 'ci/*' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy test secrets
        run: cp config/secrets.example.yml config/secrets.yml

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.2
          cache: bundler

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Run specs
        run: bundle exec rake spec
