name: "Policy: Commit Trailers"

on:
  pull_request:
  push:

jobs:
  check_trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check for forbidden Co-authored-by trailers
        shell: bash
        run: |
          set -euo pipefail
          echo "Event: $GITHUB_EVENT_NAME"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          else
            BASE_BRANCH="${{ github.event.repository.default_branch }}"
          fi
          BASE_REF="origin/${BASE_BRANCH}"
          git fetch origin "${BASE_BRANCH}" --depth=1 || true
          git rev-parse --verify "$BASE_REF" >/dev/null 2>&1 || BASE_REF=$(git rev-parse --verify HEAD~50)
          echo "Comparing $BASE_REF..HEAD"
          if git log --pretty=%B "$BASE_REF"..HEAD | grep -i -E 'Co-authored-by:.*(copilot|cursor|openai|anthropic)' >/dev/null 2>&1; then
            echo "Forbidden AI Co-authored-by trailer found in commit messages."
            git log --pretty=%B "$BASE_REF"..HEAD | grep -i -n -E 'Co-authored-by:.*(copilot|cursor|openai|anthropic)' || true
            exit 1
          fi
          echo "No forbidden trailers found."
