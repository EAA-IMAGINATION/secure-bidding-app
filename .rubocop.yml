# Rubocop configuration for Secure Bidding App

plugins:
  - rubocop-performance

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - '.bundle/**/*'
    - 'bin/**/*'
    - 'node_modules/**/*'

Layout/LineLength:
  Max: 100

Style/StringLiterals:
  EnforcedStyle: single_quotes

Metrics/MethodLength:
  Max: 30
  Exclude:
    - 'app/controllers/app.rb'

Metrics/ClassLength:
  Max: 300
  Exclude:
    - 'app/controllers/app.rb'

Metrics/AbcSize:
  Max: 30

Metrics/BlockLength:
  Max: 50
  Exclude:
    - 'spec/**/*_spec.rb'
    - 'app/controllers/app.rb'

Style/Documentation:
  Enabled: false

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*_spec.rb'

Style/OpenStructUse:
  Exclude:
    - 'spec/**/*_spec.rb'

